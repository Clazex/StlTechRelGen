version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    target-branch: dev
    commit-message:
      prefix: "chore: "
    ignore:
      - dependency-name: CWTools
    groups:
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    target-branch: dev
    commit-message:
      prefix: "chore: "
    groups:
      actions:
        patterns:
          - "*"
